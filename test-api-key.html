<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Key Test - Weather Widget</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-result {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>🔑 API Key Test Tool</h1>
    <p>This tool helps verify if your OpenWeatherMap API key is working correctly.</p>
    
    <div id="results"></div>
    
    <button onclick="testAPIKey()">Test API Key</button>
    
    <script src="config.js"></script>
    <script>
        function addResult(message, type) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }
        
        async function testAPIKey() {
            const results = document.getElementById('results');
            results.innerHTML = '';
            
            // Check if CONFIG is loaded
            if (typeof CONFIG === 'undefined') {
                addResult('❌ <strong>Error:</strong> CONFIG object not found. Make sure config.js is loaded.', 'error');
                return;
            }
            
            // Check if API key is set
            if (!CONFIG.API_KEY || CONFIG.API_KEY === 'YOUR_API_KEY_HERE') {
                addResult('❌ <strong>Error:</strong> API key not configured in config.js', 'error');
                return;
            }
            
            addResult(`✅ API Key found: <code>${CONFIG.API_KEY.substring(0, 8)}...</code>`, 'info');
            addResult('🔄 Testing API key with a simple request...', 'info');
            
            // Test the API key with a simple request
            const testUrl = `${CONFIG.API_BASE_URL}/weather?q=London&units=metric&appid=${CONFIG.API_KEY}`;
            
            try {
                const response = await fetch(testUrl);
                const data = await response.json();
                
                if (response.ok) {
                    addResult(`✅ <strong>Success!</strong> API key is valid and working.`, 'success');
                    addResult(`📍 Test city: ${data.name}, ${data.sys.country}<br>🌡️ Temperature: ${data.main.temp}°C`, 'success');
                } else {
                    if (response.status === 401) {
                        addResult(`❌ <strong>Invalid API Key</strong> (401 Unauthorized)`, 'error');
                        addResult(`Error message: ${data.message || 'No details provided'}`, 'error');
                        addResult(`<strong>Possible causes:</strong><ul>
                            <li>API key is incorrect or has typos</li>
                            <li>API key is not activated yet (takes 10-60 minutes after signup)</li>
                            <li>API key was revoked or expired</li>
                        </ul>`, 'error');
                        addResult(`<strong>Solution:</strong><ol>
                            <li>Go to <a href="https://openweathermap.org/api" target="_blank">OpenWeatherMap API</a></li>
                            <li>Log in to your account</li>
                            <li>Check your API keys in the dashboard</li>
                            <li>Make sure the key is activated (green status)</li>
                            <li>Copy the key exactly (no extra spaces)</li>
                            <li>Update config.js with the correct key</li>
                        </ol>`, 'info');
                    } else {
                        addResult(`❌ <strong>API Error:</strong> ${response.status} ${response.statusText}`, 'error');
                        addResult(`Error details: ${JSON.stringify(data, null, 2)}`, 'error');
                    }
                }
            } catch (error) {
                addResult(`❌ <strong>Network Error:</strong> ${error.message}`, 'error');
                addResult('Make sure you have an active internet connection.', 'error');
            }
        }
        
        // Auto-run test on page load
        window.addEventListener('load', () => {
            setTimeout(testAPIKey, 500);
        });
    </script>
</body>
</html>
